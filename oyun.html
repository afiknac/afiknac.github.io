<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Flappy Fikn</title>

  <!-- MOBİL KRİTİK -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: manipulation;
    }

    body {
      background: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100dvh;
      overflow: hidden;
    }

    canvas {
      background: linear-gradient(#38bdf8, #e0f2fe);
      width: 100vw;
      max-width: 420px;
      height: 100dvh;
      max-height: 720px;
      border-radius: 12px;
    }
  </style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// CANVAS GERÇEK BOYUT
function resize() {
  canvas.width = 420;
  canvas.height = 720;
}
resize();

// OYUN DEĞİŞKENLERİ
let gravity = 0.5;
let lift = -9;
let velocity = 0;
let score = 0;
let gameOver = false;

// GÖRSEL
const birdImg = new Image();
birdImg.src = "fikn.png";

// OYUNCU
let bird = {
  x: 90,
  y: 300,
  w: 42,
  h: 42
};

let pipes = [];
let pipeWidth = 64;
let gap = 170;

// BORU
function addPipe() {
  let top = Math.random() * 300 + 60;
  pipes.push({
    x: canvas.width,
    top,
    bottom: canvas.height - top - gap,
    passed: false
  });
}

function resetGame() {
  pipes = [];
  score = 0;
  velocity = 0;
  bird.y = 300;
  gameOver = false;
}

// DOKUNMA + KLAVYE
function flap() {
  if (gameOver) resetGame();
  velocity = lift;
}

document.addEventListener("keydown", e => {
  if (e.code === "Space") flap();
});

canvas.addEventListener("touchstart", e => {
  e.preventDefault();
  flap();
}, { passive: false });

canvas.addEventListener("mousedown", flap);

// OYUN
function update() {
  if (gameOver) return;

  velocity += gravity;
  bird.y += velocity;

  if (bird.y + bird.h > canvas.height || bird.y < 0) {
    gameOver = true;
  }

  pipes.forEach(pipe => {
    pipe.x -= 2.5;

    if (
      bird.x < pipe.x + pipeWidth &&
      bird.x + bird.w > pipe.x &&
      (bird.y < pipe.top || bird.y + bird.h > canvas.height - pipe.bottom)
    ) {
      gameOver = true;
    }

    if (!pipe.passed && pipe.x + pipeWidth < bird.x) {
      score++;
      pipe.passed = true;
    }
  });

  pipes = pipes.filter(p => p.x + pipeWidth > 0);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.drawImage(birdImg, bird.x, bird.y, bird.w, bird.h);

  ctx.fillStyle = "#16a34a";
  pipes.forEach(p => {
    ctx.fillRect(p.x, 0, pipeWidth, p.top);
    ctx.fillRect(p.x, canvas.height - p.bottom, pipeWidth, p.bottom);
  });

  ctx.fillStyle = "#020617";
  ctx.font = "26px Arial";
  ctx.fillText("Skor: " + score, 20, 40);

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "white";
    ctx.font = "32px Arial";
    ctx.fillText("Oyun Bitti", 120, 330);
    ctx.font = "20px Arial";
    ctx.fillText("Dokun / SPACE", 120, 370);
  }
}

let frame = 0;
function loop() {
  frame++;
  if (frame % 85 === 0 && !gameOver) addPipe();
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
