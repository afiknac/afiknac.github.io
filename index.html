<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>FİKNAC.COM</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      background: url("resim.jpg") no-repeat center center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 40px;
      border-radius: 15px;
    }

    h1 {
      color: white;
      margin-bottom: 30px;
      font-size: 36px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .btn {
      text-decoration: none;
      padding: 15px 25px;
      background: #ff9800;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn:hover {
      background: #e68900;
      transform: scale(1.05);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>FİKNAC.COM'a HOŞGELDİNİZ</h1>

    <div class="buttons">
      <a href="oyun.html" class="btn">flappy fikn</a>
      <a href="oyun2.html" class="btn">fikdino run</a>
      <a href="oyun3.html" class="btn">fikn surfers</a>
    </div>
  </div>
</body>
</html>
